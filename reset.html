<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset the app</title>
<style>
 body{margin:0;background:#0b1020;color:#e8ecf5;font:15px/1.6 ui-sans-serif,
   system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
 .box{max-width:560px;margin:0 auto;padding:40px 20px}
 h1{font-size:22px;margin:0 0 14px}
 p{color:#9aa6bf}
 .ok{color:#8fe3a4}
 .bad{color:#ffb4a2}
 ul{color:#9aa6bf;padding-left:20px}
 a.go{display:inline-block;margin-top:18px;padding:11px 18px;border-radius:9px;
   background:#1b2a47;color:#cfe3ff;border:1px solid #2c4877;
   text-decoration:none}
</style>
</head><body>
<div class="box">
  <h1>Reset the app</h1>
  <p>This page belongs to no service worker and holds no cache of its own, so
  it loads even when the app itself is stuck on an old broken copy. It tears
  out everything the app has stored on this device except the token.</p>
  <ul id="log"></ul>
  <p id="done"></p>
  <a class="go" id="back" href="./?reset=1" hidden>Open the app</a>
</div>
<script>
const log = document.getElementById('log');
const say = (text, cls) => {
  const li = document.createElement('li');
  li.textContent = text;
  if (cls) li.className = cls;
  log.appendChild(li);
};

(async () => {
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) await r.unregister();
    say(`service workers removed: ${regs.length}`, 'ok');
  } catch (e) { say('could not remove service workers: ' + e.message, 'bad'); }

  try {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
    say(`caches cleared: ${keys.length}`, 'ok');
  } catch (e) { say('could not clear caches: ' + e.message, 'bad'); }

  // The token is deliberately left alone: it is the one thing here that is
  // tedious to replace, and it was never what was broken.
  try {
    const t = localStorage.getItem('ft.token');
    say(t ? 'your token is still saved' : 'no token saved on this device');
  } catch (e) { say('storage is not readable in this browser'); }

  document.getElementById('done').innerHTML =
    'Done. Open the app below \u2014 it will fetch a fresh copy.';
  document.getElementById('back').hidden = false;
})();
</script>
</body></html>
